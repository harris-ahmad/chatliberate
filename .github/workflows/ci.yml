name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests + generated-bundle check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # npm ci installs the exact locked esbuild/tsup versions, so the bundle
      # output is deterministic and the drift check below cannot false-positive
      # on a dependency bump.
      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # apps/extension/content.js is generated. A change made directly to it is
      # erased by the next build, and a source change without a rebuild ships a
      # stale bundle. Either way source and artifact have drifted — fail loudly.
      #
      # Scoped to content.js on purpose: build:extension also rasterizes icons
      # via rsvg-convert, which is absent here (the script keeps the committed
      # PNGs and warns), and icon bytes can differ across librsvg versions.
      - name: Rebuild generated extension bundle
        run: npm run build:extension

      - name: Fail if the committed bundle is out of sync with source
        run: |
          if ! git diff --exit-code -- apps/extension/content.js; then
            echo ''
            echo '::error::apps/extension/content.js is out of sync with its source.'
            echo 'It is GENERATED by scripts/build-extension.mjs — do not edit it by hand.'
            echo 'Make the change in packages/core/src or apps/extension/src, then run:'
            echo '    npm run build:extension'
            echo 'and commit the regenerated apps/extension/content.js in the same commit.'
            echo 'See CONTRIBUTING.md.'
            exit 1
          fi
          echo 'Generated bundle matches source.'
